<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/Leaflet.VectorGrid.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/InstitutionsUTM_2.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[15.66556138441469,79.64549393042563],[17.079021349863453,81.1476211261793]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OpenStreetMap_0;
        map.addLayer(layer_OpenStreetMap_0);
        function getPopupContent_Buffer_Overlaps_1(properties) {
            return '<table>\
                    <tr>\
                        <th scope="row">Overlap_Ty</th>\
                        <td>' + (properties['Overlap_Ty'] != null ? autolinker.link(String(properties['Overlap_Ty']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Area_km2</th>\
                        <td>' + (properties['Area_km2'] != null ? autolinker.link(String(properties['Area_km2']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
        }

        map.createPane('pane_Buffer_Overlaps_1');
        map.getPane('pane_Buffer_Overlaps_1').style.zIndex = 401;

        var style_Buffer_Overlaps_1 = {'Buffer_Overlaps_1': {
                pane: 'pane_Buffer_Overlaps_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(213,180,60,1.0)',
                interactive: true}};

        var layer_Buffer_Overlaps_1 = L.vectorGrid.protobuf("data/Buffer_Overlaps_1-pbf/{z}/{x}/{y}.pbf", {
            rendererFactory: L.svg.tile,
            vectorTileLayerStyles: style_Buffer_Overlaps_1,
            pane: 'pane_Buffer_Overlaps_1',
            minNativeZoom: 3,
            maxNativeZoom: 4,
            interactive: true
        });
        bounds_group.addLayer(layer_Buffer_Overlaps_1);
        map.addLayer(layer_Buffer_Overlaps_1);
        layer_Buffer_Overlaps_1.on('click', function(e) {
            if (e.layer && e.layer.properties) {
                var feature = { properties: e.layer.properties };
                var content = removeEmptyRowsFromPopupContent(getPopupContent_Buffer_Overlaps_1(e.layer.properties), feature);
                var popup = L.popup({ maxHeight: 400 })
                    .setLatLng(e.latlng)
                    .setContent(content)
                    .openOn(map);
                setTimeout(function() {
                    addClassToPopupIfMedia(content, popup);
                }, 10);
            }
        });
        layer_Buffer_Overlaps_1.on('add', function() {
            if (!map.hasLayer(label_layer_Buffer_Overlaps_1)) {
                label_layer_Buffer_Overlaps_1.addTo(map);
            }
        });
        layer_Buffer_Overlaps_1.on('remove', function() {
            if (map.hasLayer(label_layer_Buffer_Overlaps_1)) {
                map.removeLayer(label_layer_Buffer_Overlaps_1);
            }
        });
        function pop_InstitutionsUTM_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">id</th>\
                        <td>' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Inst_Name</th>\
                        <td>' + (feature.properties['Inst_Name'] !== null ? autolinker.link(String(feature.properties['Inst_Name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Phone</th>\
                        <td>' + (feature.properties['Phone'] !== null ? autolinker.link(String(feature.properties['Phone']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Floors</th>\
                        <td>' + (feature.properties['Floors'] !== null ? autolinker.link(String(feature.properties['Floors']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td class="visible-with-data" id="Strength" colspan="2"><strong>Strength</strong><br />' + (feature.properties['Strength'] !== null ? autolinker.link(String(feature.properties['Strength']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_InstitutionsUTM_2_0() {
            return {
                pane: 'pane_InstitutionsUTM_2',
                radius: 7.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(15,157,88,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_InstitutionsUTM_2');
        map.getPane('pane_InstitutionsUTM_2').style.zIndex = 402;
        map.getPane('pane_InstitutionsUTM_2').style['mix-blend-mode'] = 'normal';
        var layer_InstitutionsUTM_2 = new L.geoJson(json_InstitutionsUTM_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_InstitutionsUTM_2',
            layerName: 'layer_InstitutionsUTM_2',
            pane: 'pane_InstitutionsUTM_2',
            onEachFeature: pop_InstitutionsUTM_2,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_InstitutionsUTM_2_0(feature));
            },
        });
        bounds_group.addLayer(layer_InstitutionsUTM_2);
        map.addLayer(layer_InstitutionsUTM_2);
        setBounds();
        var i = 0;
        layer_InstitutionsUTM_2.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['Inst_Name'] !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['Inst_Name']).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_InstitutionsUTM_2'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_InstitutionsUTM_2]);
        map.on("zoomend", function(){
            resetLabels([layer_InstitutionsUTM_2]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_InstitutionsUTM_2]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_InstitutionsUTM_2]);
        });
        </script>        
    </body>
</html>
